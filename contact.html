<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Contact Greenden</title>
</head>

<body class="bg-green-50">

    <!-- Navbar -->
    <nav class="bg-green-600 text-white p-5 flex justify-between">

        <h1 class="text-2xl font-bold">
            Greenden 🌱
        </h1>

        <div class="flex gap-5">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </div>

    </nav>


    <!-- Contact Section -->
    <section class="p-10">

        <h1 class="text-3xl font-bold text-center text-green-700 mb-5">
            Contact Us 📞
        </h1>


        <div class="bg-white max-w-md mx-auto p-6 rounded shadow">

            <form>

                <label class="font-bold">Name</label>
                <input type="text"
                       placeholder="Enter your name"
                       class="border border-gray-300 w-full p-3 mt-2 mb-4 rounded">


                <label class="font-bold">Email</label>
                <input type="email"
                       placeholder="Enter your email"
                       class="border border-gray-300 w-full p-3 mt-2 mb-4 rounded">


                <label class="font-bold">Message</label>
                <textarea
                    placeholder="Enter your message"
                    class="border border-gray-300 w-full p-3 mt-2 mb-4 rounded">
                </textarea>


                <button class="bg-green-600 text-white w-full p-3 rounded">
                    Send Message
                </button>

            </form>

        </div>

    </section>


    <footer class="bg-green-800 text-white text-center p-5">
        © 2026 Greenden
    </footer>

</body>
</html>
